[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dlna-cast"
dynamic = ["version"]
description = "Mirror or extend a Wayland desktop to a DLNA TV."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
# PyGObject and GStreamer come from the distribution's packages (see README).
dependencies = []

[project.scripts]
dlna-cast = "dlna_cast.cli:main"

[tool.setuptools.dynamic]
version = { attr = "dlna_cast.__version__" }

[tool.ruff]
line-length = 120
